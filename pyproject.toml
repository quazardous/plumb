[project]
name = "plumb-q"
dynamic = ["version"]
description = "A Symfony-style service container for Python: services declared in YAML, tied to configuration by parameters, compiled and checked before anything runs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Berlioz" }]
requires-python = ">=3.10"
keywords = ["dependency injection", "service container", "ioc", "symfony", "yaml", "autowiring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/quazardous/plumb"
Source = "https://github.com/quazardous/plumb"
Issues = "https://github.com/quazardous/plumb/issues"
Changelog = "https://github.com/quazardous/plumb/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "quazardous.plumb.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
# `quazardous` is a PEP 420 namespace: no __init__.py, shared with other distributions.
namespaces = true
include = ["quazardous.plumb*"]

[tool.setuptools.package-data]
"quazardous.plumb" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
